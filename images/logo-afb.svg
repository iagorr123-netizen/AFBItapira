<svg viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradientes -->
  <defs>
    <linearGradient id="gradientYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradientGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7CB342;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#558B2F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Ícone hexágono 3D -->
  <!-- Lado esquerdo amarelo -->
  <polygon points="20,25 20,55 35,65 35,35" fill="url(#gradientYellow)" />

  <!-- Lado direito verde -->
  <polygon points="35,35 35,65 50,55 50,25" fill="url(#gradientGreen)" />

  <!-- Topo amarelo claro -->
  <polygon points="20,25 35,15 50,25 35,35" fill="#FFE082" opacity="0.9" />

  <!-- Centro destaque -->
  <polygon points="27,35 35,30 43,35 35,40" fill="rgba(255,255,255,0.3)" />

  <!-- Texto "AFB" -->
  <text x="70" y="58" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#1a1a1a" letter-spacing="-2">AFB</text>

  <!-- Subtítulo -->
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#666666" letter-spacing="0.5">Agropecuária • Fazenda Brasil</text>
</svg>